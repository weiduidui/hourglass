<!DOCTYPE html>
<html>
<head>
  <base href="/hourglass/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hourglass - 沙漏">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hourglass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hourglass · 沙漏</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background: #0D1B2A;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0D1B2A 0%, #1B2838 50%, #2D3A4A 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader-icon {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #FFD54F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-title {
      margin-top: 24px;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .loader-subtitle {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.45);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loader-dots {
      display: flex;
      gap: 6px;
      margin-top: 28px;
    }

    .loader-dots span {
      width: 6px;
      height: 6px;
      background: rgba(255, 213, 79, 0.6);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-icon"></div>
    <div class="loader-title">Hourglass</div>
    <div class="loader-subtitle">沙漏</div>
    <div class="loader-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <script>
    function removeLoading() {
      var el = document.getElementById('loading');
      if (el && !el.classList.contains('hide')) {
        el.classList.add('hide');
        setTimeout(function() { el.remove(); }, 500);
      }
    }

    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          var tag = nodes[j].nodeName;
          if (tag === 'FLT-VIEW' || tag === 'FLUTTER-VIEW' || tag === 'BODY') {
            setTimeout(removeLoading, 200);
            observer.disconnect();
            return;
          }
        }
      }
    });

    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
